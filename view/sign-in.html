<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="./app/js/logos-removebg-preview.png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  </head>
  <body class="min-h-screen bg-[radial-gradient(circle_at_top_right,_rgba(59,130,246,0.24),_transparent_36%),radial-gradient(circle_at_bottom_left,_rgba(6,182,212,0.18),_transparent_42%),linear-gradient(135deg,_#020617,_#0b1220_48%,_#111827)] text-gray-200">
    <div class="fixed top-4 left-4 z-10">
      <img src="./app/js/logos-removebg-preview.png" onerror="this.onerror=null;this.src='./app/js/logo.png';" alt="Logo" class="h-28 w-28 object-contain" />
    </div>
    <div class="flex items-center justify-center min-h-screen">
      <div
        class="w-full max-w-md rounded-2xl border border-blue-500/35 bg-[radial-gradient(circle_at_top_right,_rgba(59,130,246,0.2),_transparent_42%),linear-gradient(160deg,_rgba(15,23,42,0.92),_rgba(2,6,23,0.94))] p-8 shadow-2xl shadow-blue-950/30 backdrop-blur-sm"
      >
        <h2 class="text-2xl font-bold mb-6 text-center">Sign In</h2>
        <form onsubmit="login(event)">
          <div class="mb-4">
            <label class="block text-gray-400 text-sm font-medium pl-2"
              >Email</label
            >
            <input
              name="email"
              type="email"
              class="text-[14px] w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg outline-none focus:border-blue-500 text-gray-200"
              placeholder="Example@email.com"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block text-gray-400 text-sm font-medium pl-2"
              >Password</label
            >
            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                class="text-[14px] w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg outline-none focus:border-blue-500 text-gray-200"
                placeholder="Enter Password"
                required
              />
              <button
                type="button"
                id="togglePassword"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm text-gray-400 hover:text-gray-200"
              >
                Show
              </button>
            </div>
          </div>
          <div class="flex items-center justify-between mb-4">
            <div>
              <label class="inline-flex items-center">
                <input type="checkbox" class="form-checkbox text-blue-500" />
                <span class="ml-2 mb-0.5 text-gray-400 text-sm"
                  >Remember me</span
                >
              </label>
            </div>
            <a href=""
              ><p class="text-sm font-medium text-blue-500 hover:underline">
                Forgot password?
              </p></a
            >
          </div>
          <button
            type="submit"
            class="text-sm font-medium w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"
          >
            Sign In
          </button>
        </form>
        <div>
          <p class="text-[14px] text-center mt-4">
            Don't have an account?
            <a
              href="Sign-up.html"
              class="text-[14px] font-medium text-blue-500 hover:underline"
              >Sign up here</a
            >
          </p>
        </div>
      </div>
    </div>

    <script src="./app/js/login.js"></script>

    <script>
      const passwordInput = document.getElementById("password");
      const toggleButton = document.getElementById("togglePassword");

      toggleButton.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        toggleButton.textContent = isPassword ? "Hide" : "Show";
      });
    </script>
  </body>
</html>
